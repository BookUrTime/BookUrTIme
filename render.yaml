services:
  - type: web
    name: bookurtime-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookurtime-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://book-ur-time.vercel.app,http://localhost:3000

databases:
  - name: bookurtime-db
    plan: free
